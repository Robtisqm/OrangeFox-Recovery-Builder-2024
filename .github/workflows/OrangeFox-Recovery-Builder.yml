name: OrangeFox - Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - 14.1
        - 12.1
        - 11.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/Robtisqm/android_device_samsung_n8000.git'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'lineage-14.1'
      DEVICE_PATH:
        description: 'Specify your device path.'
        required: true
        default: 'device/samsung/p4noterf'
      DEVICE_NAME:
        description: 'Specify your Device Codename.'
        required: true
        default: 'p4noterf'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Path of blobs to check'
        required: true
        default: 'system/bin/qseecomd'
      RECOVERY_TAR:
        description: 'Release recovery.tar For Samsung devices'
        required: false
        default: true
        type: boolean
      RECOVERY_INSTALLER:
        description: 'Include recovery installer zip'
        type: boolean
        required: true
        default: true

jobs:
  build:
    name: Build OFRP by ${{ github.actor }}
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Build Environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Set-up Manifest
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "OrangeFox Build"
        git config --global user.email "build@orangefox.com"
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        cd ./${{ github.event.inputs.DEVICE_PATH }}
        
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

        # === Создание чистой Omni-обертки ===
        echo "Генерируем виртуальный omni-конфиг для совместимости..."
        if [ -f twrp_p4noterf.mk ]; then
          echo '# Omni wrapper for TWRP tree' > omni_p4noterf.mk
          echo '$(call inherit-product, device/samsung/p4noterf/twrp_p4noterf.mk)' >> omni_p4noterf.mk
          echo 'PRODUCT_NAME := omni_p4noterf' >> omni_p4noterf.mk
        fi

    - name: Building OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        
        # Защита от OOM Killer (нехватка оперативной памяти)
        export SOONG_LINK_THREADS=1
        export NINJA_ARGS="-j2"
        export ALLOW_MISSING_DEPENDENCIES=true
        
        set +e
        source build/envsetup.sh
        set -e
        
        # Безопасная проверка профилей через полноценный if-else
        if lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-eng; then
            echo "Успешный lunch для TWRP дерева. Начинаем сборку..."
            make clean
            make -j2 adbd ${{ github.event.inputs.BUILD_TARGET }}image
        elif lunch omni_${{ github.event.inputs.DEVICE_NAME }}-eng; then
            echo "TWRP lunch не удался, переключаемся на Omni обертку..."
            make clean
            make -j2 ${{ github.event.inputs.BUILD_TARGET }}image
        else
            echo "Ошибка: Не удалось применить ни один из профилей сборки (lunch)!"
            exit 1
        fi

    - name: Set Build Date
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Check if Recovery Exist
      run: |
        cd "$GITHUB_WORKSPACE/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
        # ls корректно раскроет звёздочку в условиях GitHub Actions
        if ls out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.img >/dev/null 2>&1; then
            echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
            echo "FILE_PATH=$GITHUB_WORKSPACE/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        else
            echo "Ошибка: Готовый образ рекавери не найден в директории out!"
            exit 1
        fi

    - name: Rename the Recovery
      if: ${{ env.CHECK_IMG_IS_OK == 'true' }}
      run: |
        cd "$FILE_PATH"
        mv OrangeFox*.img recovery.img || true
        echo "RECOVERY_TYPE=recovery" >> $GITHUB_ENV

    - name: Recovery to tar for Samsung
      if: ${{ env.CHECK_IMG_IS_OK == 'true' && (github.event.inputs.RECOVERY_TAR == 'true' || github.event.inputs.RECOVERY_TAR == true) }}
      run: |
        cd "$FILE_PATH"
        tar -cvf recovery.tar recovery.img

    - name: Upload to Release
      if: ${{ env.CHECK_IMG_IS_OK == 'true' }}
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ env.FILE_PATH }}/recovery.img
          ${{ env.FILE_PATH }}/recovery.tar
        name: Unofficial OrangeFox for p4noterf // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: GT-N8000 (p4noterf)
