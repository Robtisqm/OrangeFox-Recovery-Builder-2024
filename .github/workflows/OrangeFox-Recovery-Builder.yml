name: OrangeFox - Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - 14.1
        - 12.1
        - 11.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/Robtisqm/android_device_samsung_n8000.git'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'lineage-14.1'
      DEVICE_PATH:
        description: 'Specify your device path.'
        required: true
        default: 'device/samsung/p4noterf'
      DEVICE_NAME:
        description: 'Specify your Device Codename.'
        required: true
        default: 'p4noterf'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Path of blobs to check'
        required: true
        default: 'system/bin/qseecomd'
      RECOVERY_TAR:
        description: 'Release recovery.tar For Samsung devices'
        required: false
        default: true
        type: boolean
      RECOVERY_INSTALLER:
        description: 'Include recovery installer zip'
        type: boolean
        required: true
        default: true

jobs:
  build:
    name: Build OFRP by ${{ github.actor }}
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write

    steps:
    # Step 1: Checkout the repository containing this workflow
    - name: Checkout
      uses: actions/checkout@v3

    # Step 2: Remove unneeded runtimes and tools to maximize free disk space on GitHub Runner
    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    # Step 3: Allocate additional swap space to prevent compiler crashes due to Out-Of-Memory (OOM)
    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    # Step 4: Install required build packages and run the official OrangeFox environment setup script
    - name: Build Environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh

    # Step 5: Initialize OrangeFox sync environment and pull the specified source manifest
    - name: Set-up Manifest
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "OrangeFox Build"
        git config --global user.email "build@orangefox.com"
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}

    # Step 6: Clone your custom device tree into the correct subdirectory inside the build environment
    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        cd ./${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    # Step 7: Apply linker hacks and compile the recovery image
    - name: Building OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        
        # === LINKER HACK: Global override for the strict '--no-undefined-version' flag ===
        # Android 12's Soong build system enforces symbol version matching via .map files.
        # Since we are compiling a legacy 32-bit device tree, many required mangled symbols are missing,
        # which causes ld.lld to throw fatal errors during libbinder compilation.
        echo "Patching Soong and Make build configuration files..."
        
        # 1. Force replace '--no-undefined-version' with '--undefined-version' inside Soong (Go) and Make (.mk) core files
        find build/soong/ -type f -name "*.go" -exec sed -i 's/"-Wl,--no-undefined-version"/"-Wl,--undefined-version"/g' {} +
        find build/soong/ -type f -name "*.go" -exec sed -i 's/--no-undefined-version/--undefined-version/g' {} +
        find build/make/core/ -type f -name "*.mk" -exec sed -i 's/-Wl,--no-undefined-version/-Wl,--undefined-version/g' {} +
        
        # 2. Comment out the 'version_script' attribute in libbinder's Android.bp to bypass symbol tracking completely
        BP_PATH="frameworks/native/libs/binder/Android.bp"
        if [ -f "$BP_PATH" ]; then
          echo "Disabling version_script in $BP_PATH to prevent ld.lld from parsing missing 32-bit map files."
          sed -i 's/version_script:/\/\/ version_script:/g' "$BP_PATH"
        fi
        
        echo "Linker workarounds successfully applied!"
        
        # === ENVIRONMENT VARIABLES FOR STABILITY ===
        # Restrict parallel linker threads to prevent RAM exhaustion and random worker drops
        export SOONG_LINK_THREADS=1
        # Limit build jobs to 2 threads to ensure stable compiling on GitHub runner VMs
        export NINJA_ARGS="-j2"
        # Bypass strict dependency matching rules for legacy configurations
        export ALLOW_MISSING_DEPENDENCIES=true
        export BUILD_BROKEN_MISSING_OUTPUTS=true
        
        # Initialize the Android build environment
        set +e
        source build/envsetup.sh
        set -e
        
        # Determine the target compilation profile dynamically and execute the target build engine
        if lunch omni_${{ github.event.inputs.DEVICE_NAME }}-eng; then
            echo "Profile OMNI found. Starting compilation..."
            make clean
            make -j2 ${{ github.event.inputs.BUILD_TARGET }}image
        elif lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-eng; then
            echo "OMNI profile missing, switching over to TWRP lunch routine..."
            make clean
            make -j2 adbd ${{ github.event.inputs.BUILD_TARGET }}image
        else
            echo "Critical Error: Failed to execute build initialization (lunch) for all profiles!"
            exit 1
        fi

    # Step 8: Calculate and register structural parameters and dates for automated release names
    - name: Set Build Date
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    # Step 9: Verify compilation integrity by checking if output binaries exist inside the build target folder
    - name: Check if Recovery Exist
      run: |
        cd "$GITHUB_WORKSPACE/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
        if ls out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.img >/dev/null 2>&1; then
            echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
            echo "FILE_PATH=$GITHUB_WORKSPACE/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        elif ls out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img >/dev/null 2>&1; then
            echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
            echo "FILE_PATH=$GITHUB_WORKSPACE/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
        else
            echo "Critical Error: Compiled binary image not found inside build out directory!"
            exit 1
        fi

    # Step 10: Standardize output filename to ensure compatibility across flashing tools
    - name: Rename the Recovery
      if: ${{ env.CHECK_IMG_IS_OK == 'true' }}
      run: |
        cd "$FILE_PATH"
        if ls OrangeFox*.img >/dev/null 2>&1; then
          mv OrangeFox*.img recovery.img
        fi
        echo "RECOVERY_TYPE=recovery" >> $GITHUB_ENV

    # Step 11: Pack the compiled binary image into a .tar archive for compatibility with Samsung Odin tool
    - name: Recovery to tar for Samsung
      if: ${{ env.CHECK_IMG_IS_OK == 'true' && (github.event.inputs.RECOVERY_TAR == 'true' || github.event.inputs.RECOVERY_TAR == true) }}
      run: |
        cd "$FILE_PATH"
        tar -cvf recovery.tar recovery.img

    # Step 12: Upload binaries (.img and .tar) directly to GitHub Repository Releases page
    - name: Upload to Release
      if: ${{ env.CHECK_IMG_IS_OK == 'true' }}
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ env.FILE_PATH }}/recovery.img
          ${{ env.FILE_PATH }}/recovery.tar
        name: Unofficial OrangeFox for p4noterf // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: GT-N8000 (p4noterf)
